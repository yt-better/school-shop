<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - 校易购</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <div class="nav-inner">
            <a href="index.html" class="nav-logo">
                <div class="nav-logo-mark">校</div>
                <span class="nav-logo-text">校易购</span>
            </a>
            <div class="nav-actions">
                <a href="index.html" class="nav-action">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
                    <span>返回首页</span>
                </a>
            </div>
        </div>
    </nav>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-logo">校</div>
                <h1 class="auth-title">创建账号</h1>
                <p class="auth-desc">加入校易购，开启便捷校园生活</p>
            </div>
            <form class="auth-form" onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label class="form-label">学号</label>
                    <input type="text" class="form-input" placeholder="请输入学号" required>
                </div>
                <div class="form-group">
                    <label class="form-label">手机号</label>
                    <input type="tel" class="form-input" placeholder="请输入手机号" required>
                </div>
                <div class="form-group">
                    <label class="form-label">密码</label>
                    <input type="password" class="form-input" placeholder="请设置密码（至少 6 位）" required minlength="6">
                </div>
                <div class="form-group">
                    <label class="form-label">确认密码</label>
                    <input type="password" class="form-input" placeholder="请再次输入密码" required>
                </div>
                <div class="form-group">
                    <label class="form-label">宿舍楼栋</label>
                    <select class="form-input" required>
                        <option value="">请选择宿舍楼栋</option>
                        <option value="1">1 号楼</option>
                        <option value="2">2 号楼</option>
                        <option value="3">3 号楼</option>
                        <option value="4">4 号楼</option>
                        <option value="5">5 号楼</option>
                        <option value="6">6 号楼</option>
                    </select>
                </div>
                <button type="submit" class="auth-btn">注 册</button>
            </form>
            <div class="auth-links">
                <a href="login.html" class="auth-link">已有账号？去登录</a>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
    <script>
        function handleRegister(e) {
            e.preventDefault();
            showToast('注册成功！');
            setTimeout(() => { window.location.href = 'login.html'; }, 1000);
        }
    </script>
</body>
</html>
