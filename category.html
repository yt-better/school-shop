<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商品分类 - 校易购</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="top-bar">新学期特惠：全场满 59 减 10，满 99 减 20，送货上门到宿舍</div>
    <nav>
        <div class="nav-inner">
            <a href="index.html" class="nav-logo">
                <div class="nav-logo-mark">校</div>
                <span class="nav-logo-text">校易购</span>
            </a>
            <div class="nav-search">
                <svg class="nav-search-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                </svg>
                <input type="text" placeholder="搜索商品、店铺、服务">
            </div>
            <div class="nav-actions">
                <a href="index.html" class="nav-action" title="返回首页">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path>
                    </svg>
                    <span>首页</span>
                </a>
                <a href="login.html" class="nav-action">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                    </svg>
                    <span>我的</span>
                </a>
                <a href="cart.html" class="nav-action nav-cart">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"></path>
                    </svg>
                    <span>购物车</span>
                    <div class="cart-badge">0</div>
                </a>
            </div>
        </div>
    </nav>
    <div class="category-nav">
        <div class="category-list">
            <a href="index.html" class="category-item">首页</a>
            <a href="category.html?cat=snacks" class="category-item">零食速食</a>
            <a href="category.html?cat=beverages" class="category-item">饮料冲调</a>
            <a href="category.html?cat=fruits" class="category-item">生鲜水果</a>
            <a href="category.html?cat=stationery" class="category-item">文具办公</a>
            <a href="category.html?cat=digital" class="category-item">数码配件</a>
            <a href="category.html?cat=dorm" class="category-item">生活用品</a>
            <a href="second-hand.html" class="category-item">二手闲置</a>
            <a href="services.html" class="category-item">校园服务</a>
        </div>
    </div>
    <div class="page-header">
        <div class="container">
            <h1 class="page-title" id="category-title">全部商品</h1>
            <p class="page-desc">共 <span id="product-count">0</span> 件商品</p>
        </div>
    </div>
    <div class="container">
        <div class="filter-bar">
            <button class="filter-btn active" onclick="filterProducts('all')">全部</button>
            <button class="filter-btn" onclick="filterProducts('snacks')">零食速食</button>
            <button class="filter-btn" onclick="filterProducts('beverages')">饮料冲调</button>
            <button class="filter-btn" onclick="filterProducts('fruits')">生鲜水果</button>
            <button class="filter-btn" onclick="filterProducts('stationery')">文具办公</button>
            <button class="filter-btn" onclick="filterProducts('digital')">数码配件</button>
            <button class="filter-btn" onclick="filterProducts('dorm')">生活用品</button>
            <button class="filter-btn" onclick="sortProducts('price')">价格从低到高</button>
            <button class="filter-btn" onclick="sortProducts('sales')">销量优先</button>
        </div>
    </div>
    <section style="padding-top: 0;">
        <div class="container">
            <div class="product-grid" id="product-list"></div>
        </div>
    </section>
    <footer>
        <div class="container">
            <div class="footer-bottom" style="border-top: none;">
                <p class="footer-copy"> 2026 校易购 · 校园生活服务平台</p>
            </div>
        </div>
    </footer>
    <script src="app.js"></script>
    <script>
        let currentCategory = 'all';
        let currentSort = 'default';
        const urlParams = new URLSearchParams(window.location.search);
        const catParam = urlParams.get('cat');
        if (catParam) currentCategory = catParam;

        const categoryNames = {
            'all': '全部商品', 'snacks': '零食速食', 'beverages': '饮料冲调',
            'fruits': '生鲜水果', 'stationery': '文具办公', 'digital': '数码配件', 'dorm': '生活用品'
        };

        function updateTitle() {
            document.getElementById('category-title').textContent = categoryNames[currentCategory] || '全部商品';
        }

        function filterProducts(category) {
            currentCategory = category;
            updateTitle();
            render();
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.textContent === categoryNames[category]) btn.classList.add('active');
            });
        }

        function sortProducts(type) {
            currentSort = type;
            render();
        }

        function render() {
            let filtered = filterByCategory(currentCategory);
            if (currentSort === 'price') filtered = sortByPrice(filtered, true);
            else if (currentSort === 'sales') filtered = sortBySales(filtered);
            document.getElementById('product-count').textContent = filtered.length;
            renderProducts(filtered, document.getElementById('product-list'));
        }

        updateTitle();
        render();
    </script>
</body>
</html>
